# git-cliff configuration: builds the changelog and the release notes from the Conventional
# Commits messages. CHANGELOG.md:  git cliff --tag v1.2.3 -o CHANGELOG.md
# Notes of the latest tag (CI):    git cliff --latest --strip all
# See https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Stride. Generated from the commit messages by
[git-cliff](https://git-cliff.org); the project uses
[Semantic Versioning](https://semver.org/)."""
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/drook207/stride/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/drook207/stride/commit/{{ commit.id }}))
{% endfor -%}
{% endfor -%}
"""
footer = "<!-- generated by git-cliff -->"
# Each release starts with a blank line (the body above), and never two blank lines in a row, as
# markdownlint wants. Not trimmed, so the blank line between releases stays.
trim = false
postprocessors = [
    { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
# Older commits from before the project used Conventional Commits are left out.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# Only what users notice ends up in the notes; the HTML comments set the order of the groups.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = ".*", skip = true },
]
