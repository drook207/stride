# Documentation website, built with MkDocs + Material and published on GitHub Pages by the
# `docs` and `deploy-pages` jobs in .github/workflows/ci.yml. Preview locally:
#   pip install -r docs/requirements.txt && mkdocs serve

site_name: Stride
site_description: Track time on Redmine issues - Qt 6 desktop and mobile app with offline support.
site_url: https://drook207.github.io/stride/
repo_name: drook207/stride
repo_url: https://github.com/drook207/stride
edit_uri: edit/main/docs/
copyright: Licensed under the MIT License

theme:
  name: material
  favicon: assets/app-icon.svg
  logo: assets/app-icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide: user-guide.md
  - Development:
      - Building: development/building.md
      - Testing: development/testing.md
      - Local Redmine: development/test-environment.md
      - Logging: development/logging.md
      - Translations: development/translations.md
      - Installer: development/packaging.md
      - Contributing: development/contributing.md
