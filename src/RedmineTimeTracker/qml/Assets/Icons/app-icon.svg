<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Background circle -->
    <circle cx="256" cy="256" r="240" fill="#B32024"/>

    <!-- Inner circle (clock face) -->
    <circle cx="256" cy="256" r="200" fill="#FFFFFF"/>

    <!-- Hour markers -->
    <g stroke="#333333" stroke-width="8">
        <line x1="256" y1="86" x2="256" y2="106"/>
        <line x1="426" y1="256" x2="406" y2="256"/>
        <line x1="256" y1="426" x2="256" y2="406"/>
        <line x1="86" y1="256" x2="106" y2="256"/>
    </g>

    <!-- Clock hands -->
    <g transform="rotate(45, 256, 256)">
        <line x1="256" y1="256" x2="256" y2="146" stroke="#B32024" stroke-width="12" stroke-linecap="round"/>
        <line x1="256" y1="256" x2="336" y2="256" stroke="#B32024" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Redmine "R" -->
    <path d="M206,176 h80 q40,0 40,40 q0,40 -40,40 h-30 l40,60 h-40 l-40,-60 h-10 v60 h-30 v-140"
          fill="#B32024" stroke="#B32024" stroke-width="2"/>

    <!-- Outer ring -->
    <circle cx="256" cy="256" r="240" fill="none" stroke="#B32024" stroke-width="32"/>
</svg>
