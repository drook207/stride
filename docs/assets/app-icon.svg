<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!--
        Application icon, matching the app's Qt Quick Controls Material Dark theme (qml/Main.qml):
        a stopwatch whose ring doubles as a progress arc in the accent color, on the dark app
        background, with the light "active pill" color of the sidebar for the hand and crown.
    -->
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2B2930"/>
            <stop offset="1" stop-color="#1C1B1F"/>
        </linearGradient>
    </defs>

    <!-- Rounded tile in the app's background color -->
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#background)"/>
    <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

    <!-- Crown and side button -->
    <rect x="221" y="62" width="70" height="40" rx="14" fill="#E8E1F5"/>
    <rect x="243" y="96" width="26" height="34" fill="#E8E1F5"/>
    <rect x="364" y="112" width="44" height="30" rx="10" fill="#E8E1F5" transform="rotate(45 386 127)"/>

    <!-- Dial track and elapsed-time arc (75%, clockwise from 12 o'clock) -->
    <circle cx="256" cy="292" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="40"/>
    <circle cx="256" cy="292" r="150" fill="none" stroke="#9F8FEF" stroke-width="40" stroke-linecap="round"
            stroke-dasharray="706.86 942.48" transform="rotate(-90 256 292)"/>

    <!-- Hand -->
    <line x1="256" y1="292" x2="322" y2="226" stroke="#E8E1F5" stroke-width="24" stroke-linecap="round"/>
    <circle cx="256" cy="292" r="22" fill="#E8E1F5"/>
</svg>
