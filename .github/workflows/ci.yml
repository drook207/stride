# Checks every pull request and main: the pre-commit hooks, then build, unit tests and qmllint,
# and the documentation website, which main also publishes on GitHub Pages.
# Pull requests only build and test when code changed and only build the docs when they changed
# (see the `changes` job); main always runs everything. A new push to a pull request cancels the
# run of the previous one. A running main run is never canceled, but GitHub keeps only one pending
# run per group, so a main run still waiting for the previous one is replaced by a newer push.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What a pull request changed: `code` (what the app is built from) and `docs`.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # A pull request's HEAD is its merge commit; its first parent is the target branch.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            { echo "code=true"; echo "docs=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "$changed"
          check() {
            if grep -Eq "$2" <<< "$changed"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"
          }
          # LICENSE, LICENSES/ and THIRD_PARTY_NOTICES.md are installed and packaged by src/Stride.
          check code '^(src/|tests/|CMakeLists\.txt$|CMakePresets\.json$|LICENSE$|LICENSES/|THIRD_PARTY_NOTICES\.md$|\.github/workflows/)'
          check docs '^(docs/|mkdocs\.yml$|\.github/workflows/)'

  pre-commit:
    runs-on: ubuntu-24.04
    env:
      # no-commit-to-branch guards local commits only; clang-tidy needs the build's compile database.
      SKIP: no-commit-to-branch,clang-tidy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install --quiet pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # Ubuntu with the build dependencies and Qt from aqtinstall, cached per Qt version.
  build-and-test:
    needs: [changes, pre-commit]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: "6.11.2"
    steps:
      - uses: actions/checkout@v4
      # Where aqtinstall puts Qt below; CMakePresets.json reads QT_DIR.
      - run: echo "QT_DIR=$GITHUB_WORKSPACE/.qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
      - name: Install the build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates curl pkg-config python3-venv \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1 libdbus-1-3 libsecret-1-dev libglib2.0-dev
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: .qt
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv /tmp/aqt
          /tmp/aqt/bin/pip install --quiet aqtinstall==3.3.0
          /tmp/aqt/bin/aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir .qt
      - run: cmake --preset linux-debug
      - run: cmake --build --preset linux-debug
      - name: Run the tests
        run: |
          # Isolated from any real settings, keychain and display.
          HOME="$(mktemp -d)"
          export HOME DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent QT_QPA_PLATFORM=offscreen
          build/linux-debug/tests/stride-tests --gtest_output=xml:"$GITHUB_WORKSPACE/test-report.xml"
      - name: qmllint
        run: |
          # qmllint only warns; fail on any warning so the QML stays type-checkable.
          cmake --build --preset linux-debug --target all_qmllint 2>&1 | tee qmllint.log
          if grep -q '^Warning' qmllint.log; then echo "qmllint reported warnings"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-report.xml
            qmllint.log
          if-no-files-found: ignore
          retention-days: 7

  # MkDocs website from docs/ and mkdocs.yml; --strict fails on broken links and missing pages.
  # Needs nothing else, so it runs and deploys without waiting for the Qt build.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install --quiet -r docs/requirements.txt
      - run: mkdocs build --strict --site-dir site
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site

  # Publishes the website built above on GitHub Pages, from main only.
  deploy-pages:
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
